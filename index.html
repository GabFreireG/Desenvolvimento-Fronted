<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas Acadêmicas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>
      <!-- Raio idêntico ao modelo da 2ª imagem -->
      <svg class="icone-raio-4pontas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 2L3 14h7v8l10-12h-7z" />
      </svg>
      Tarefas Acadêmicas
    </h1>
  </header>

  <main>
    <section aria-labelledby="buscaFiltros">
      <h2 id="buscaFiltros">Buscar e Filtrar</h2>
      <form id="formFiltros">
        <div>
          <label for="buscaTitulo">Buscar por título</label>
          <div class="campo-busca">
            <input type="search" id="buscaTitulo" placeholder="Digite o título da tarefa..." />
            <button type="submit" id="btnBuscar">Buscar</button>
          </div>
        </div>

        <fieldset>
          <legend>Filtrar por Status</legend>
          <label><input type="radio" name="filtroStatus" value="todos" checked /> Todos</label>
          <label><input type="radio" name="filtroStatus" value="a_fazer" /> A Fazer</label>
          <label><input type="radio" name="filtroStatus" value="em_andamento" /> Em Andamento</label>
          <label><input type="radio" name="filtroStatus" value="em_revisao" /> Em Revisão</label>
          <label><input type="radio" name="filtroStatus" value="concluida" /> Concluída</label>
        </fieldset>

        <fieldset>
          <legend>Filtrar por Prioridade</legend>
          <label><input type="radio" name="filtroPrioridade" value="todas" checked /> Todas</label>
          <label><input type="radio" name="filtroPrioridade" value="baixa" /> Baixa</label>
          <label><input type="radio" name="filtroPrioridade" value="media" /> Média</label>
          <label><input type="radio" name="filtroPrioridade" value="alta" /> Alta</label>
        </fieldset>

        <div class="acoes-filtros">
          <button type="button" id="btnAplicarFiltros">Aplicar Filtros</button>
        </div>
      </form>
    </section>

    <div id="regiaoStatus" class="sr-only" aria-live="polite"></div>

    <section aria-labelledby="quadroTarefas">
      <h2 id="quadroTarefas">Quadro de Tarefas</h2>
      <div id="containerEstado"></div>

      <div class="kanban-grid">
        <section aria-labelledby="aFazer">
          <h3 id="aFazer">A Fazer</h3>
          <ul id="listaAFazer"></ul>
        </section>

        <section aria-labelledby="emAndamento">
          <h3 id="emAndamento">Em Andamento</h3>
          <ul id="listaEmAndamento"></ul>
        </section>

        <section aria-labelledby="emRevisao">
          <h3 id="emRevisao">Em Revisão</h3>
          <ul id="listaEmRevisao"></ul>
        </section>

        <section aria-labelledby="tarefasConcluidas">
          <h3 id="tarefasConcluidas">Concluídas</h3>
          <ul id="listaConcluidas"></ul>
        </section>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; Tarefas Acadêmicas - Organização e Produtividade</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
